<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Letter 01 - Special Moment</title>
  <!-- Google Fonts: Cursive Script & Elegant Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background-color: #f7eedf;
      background-image: url('letter1_bg.jpg');
      background-repeat: no-repeat;
      background-position: center bottom;
      background-size: contain;
      border-left: 14px solid #8b1e3f;
      border-right: 14px solid #8b1e3f;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 210px 16px;
      font-family: 'Playfair Display', Georgia, serif;
      position: relative;
      overflow-x: hidden;
    }

    /* Hand-drawn matching doodle hearts */
    .doodle-heart {
      position: absolute;
      width: 13px;
      height: 15px;
      opacity: 0.75;
      pointer-events: none;
      z-index: 1;
    }

    /* Natural organic placements matching the bottom illustration feel */
    .h1  { top: 22px; right: 34px; transform: rotate(14deg); width: 12px; }
    .h2  { top: 38px; left: 24px; transform: rotate(-18deg); width: 13px; }
    .h3  { top: 80px; left: 16px; transform: rotate(10deg); width: 11px; }
    .h4  { top: 92px; right: 22px; transform: rotate(-12deg); width: 13px; }
    .h5  { top: 140px; right: 38px; transform: rotate(18deg); width: 14px; }
    .h6  { top: 155px; left: 30px; transform: rotate(-15deg); width: 12px; }
    .h7  { top: 205px; left: 14px; transform: rotate(8deg); width: 13px; }
    .h8  { top: 220px; right: 28px; transform: rotate(-22deg); width: 12px; }
    .h9  { top: 265px; left: 24px; transform: rotate(-10deg); width: 14px; }
    .h10 { top: 280px; right: 18px; transform: rotate(15deg); width: 13px; }
    .h11 { top: 330px; left: 36px; transform: rotate(20deg); width: 12px; }
    .h12 { top: 345px; right: 32px; transform: rotate(-8deg); width: 14px; }
    .h13 { top: 395px; left: 20px; transform: rotate(-16deg); width: 13px; }
    .h14 { top: 410px; right: 24px; transform: rotate(12deg); width: 12px; }
    .h15 { top: 460px; right: 40px; transform: rotate(-14deg); width: 13px; }

    .main-wrapper {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .back-btn {
      align-self: flex-start;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid #ebd3da;
      padding: 6px 16px;
      border-radius: 20px;
      color: #6a1b29;
      font-family: 'Dancing Script', cursive;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(139, 30, 63, 0.08);
      transition: transform 0.15s ease;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .letter-body {
      width: 100%;
      padding: 10px 6px;
      text-align: center;
    }

    .letter-header {
      font-family: 'Dancing Script', cursive;
      font-size: 32px;
      font-weight: 700;
      color: #6a1b29;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .divider {
      width: 45px;
      height: 2px;
      background: #c98292;
      margin: 0 auto 16px auto;
      border-radius: 2px;
      opacity: 0.7;
    }

    .letter-content {
      font-family: 'Dancing Script', cursive;
      font-size: 23px;
      line-height: 1.65;
      color: #4a2828;
      text-align: center;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    .signature {
      margin-top: 18px;
      font-family: 'Dancing Script', cursive;
      font-size: 25px;
      font-weight: 700;
      color: #8b1e3f;
    }
  </style>
</head>
<body>

  <!-- Reusable SVG definition crafted exactly like the bottom doodle art -->
  <svg style="display: none;">
    <defs>
      <g id="mini-heart">
        <path d="M50 28 C42 12, 18 16, 18 36 C18 52, 38 68, 50 82 C62 68, 82 52, 82 36 C82 16, 58 12, 50 28 Z" 
              fill="none" 
              stroke="#c47279" 
              stroke-width="5" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
      </g>
    </defs>
  </svg>

  <!-- 15 Organically scattered matching doodle hearts -->
  <svg class="doodle-heart h1" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h2" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h3" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h4" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h5" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h6" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h7" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h8" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h9" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h10" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h11" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h12" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h13" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h14" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h15" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>

  <div class="main-wrapper">
    <a href="page2.html" class="back-btn">← Back to Letters</a>

    <div class="letter-body">
      <div class="letter-header">_Our First Memory_</div>
      <div class="divider"></div>
      
      <div class="letter-content">
        _Sample text: Every single moment with you feels like a beautiful dream that I never want to wake up from. Looking at you, holding your hands, and just sharing simple moments together means everything to me..._
      </div>

      <div class="signature">
        _Forever Yours ❤️_
      </div>
    </div>
  </div>

</body>
</html>
