<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Letter 01 - Special Moment</title>
  <!-- Google Fonts: Cursive Script & Elegant Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background-color: #f7eedf;
      /* Background Image: Positioned at bottom center */
      background-image: url('letter1_bg.jpg');
      background-repeat: no-repeat;
      background-position: center bottom;
      background-size: contain;
      border-left: 14px solid #8b1e3f;
      border-right: 14px solid #8b1e3f;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 200px 16px; /* Safe space above couple art */
      font-family: 'Playfair Display', Georgia, serif;
    }

    .main-wrapper {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Back Navigation Button */
    .back-btn {
      align-self: flex-start;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid #ebd3da;
      padding: 6px 16px;
      border-radius: 20px;
      color: #6a1b29;
      font-family: 'Dancing Script', cursive;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(139, 30, 63, 0.08);
      transition: transform 0.15s ease;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    /* Seamless Handwritten Letter Text (No Box / No Border) */
    .letter-body {
      width: 100%;
      padding: 10px 6px;
      text-align: center;
    }

    .letter-header {
      font-family: 'Dancing Script', cursive;
      font-size: 32px;
      font-weight: 700;
      color: #6a1b29;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .divider {
      width: 45px;
      height: 2px;
      background: #c98292;
      margin: 0 auto 16px auto;
      border-radius: 2px;
      opacity: 0.7;
    }

    .letter-content {
      font-family: 'Dancing Script', cursive;
      font-size: 23px;
      line-height: 1.65;
      color: #4a2828;
      text-align: center;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);
    }

    .signature {
      margin-top: 18px;
      font-family: 'Dancing Script', cursive;
      font-size: 25px;
      font-weight: 700;
      color: #8b1e3f;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    
    <!-- Back Button -->
    <a href="page2.html" class="back-btn">← Back to Letters</a>

    <!-- Seamless Text directly over Background -->
    <div class="letter-body">
      <div class="letter-header">_Our First Memory_</div>
      <div class="divider"></div>
      
      <div class="letter-content">
        _Sample text: Every single moment with you feels like a beautiful dream that I never want to wake up from. Looking at you, holding your hands, and just sharing simple moments together means everything to me..._
      </div>

      <div class="signature">
        _Forever Yours ❤️_
      </div>
    </div>

  </div>

</body>
</html>
