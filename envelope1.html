<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Letter 01 - Special Moment</title>
  <!-- Google Fonts: Cursive Script & Elegant Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background-color: #f7eedf;
      background-image: url('letter1_bg.jpg');
      background-repeat: no-repeat;
      background-position: center bottom;
      background-size: contain;
      border-left: 14px solid #8b1e3f;
      border-right: 14px solid #8b1e3f;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 210px 16px;
      font-family: 'Playfair Display', Georgia, serif;
      position: relative;
      overflow-x: hidden;
    }

    /* Hand-drawn minimal doodle hearts */
    .doodle-heart {
      position: absolute;
      width: 14px;
      height: 14px;
      opacity: 0.55;
      pointer-events: none;
      z-index: 1;
    }

    /* Organic scattered positions - only in upper letter zone */
    .h1 { top: 38px; right: 28px; transform: rotate(14deg); }
    .h2 { top: 95px; left: 24px; transform: rotate(-18deg); width: 12px; height: 12px; }
    .h3 { top: 150px; right: 20px; transform: rotate(-8deg); width: 15px; height: 15px; }
    .h4 { top: 220px; left: 32px; transform: rotate(12deg); width: 11px; height: 11px; }
    .h5 { top: 290px; right: 35px; transform: rotate(20deg); width: 13px; height: 13px; }
    .h6 { top: 340px; left: 26px; transform: rotate(-10deg); width: 14px; height: 14px; }

    .main-wrapper {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .back-btn {
      align-self: flex-start;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid #ebd3da;
      padding: 6px 16px;
      border-radius: 20px;
      color: #6a1b29;
      font-family: 'Dancing Script', cursive;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(139, 30, 63, 0.08);
      transition: transform 0.15s ease;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .letter-body {
      width: 100%;
      padding: 10px 6px;
      text-align: center;
    }

    .letter-header {
      font-family: 'Dancing Script', cursive;
      font-size: 32px;
      font-weight: 700;
      color: #6a1b29;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .divider {
      width: 45px;
      height: 2px;
      background: #c98292;
      margin: 0 auto 16px auto;
      border-radius: 2px;
      opacity: 0.7;
    }

    .letter-content {
      font-family: 'Dancing Script', cursive;
      font-size: 23px;
      line-height: 1.65;
      color: #4a2828;
      text-align: center;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    .signature {
      margin-top: 18px;
      font-family: 'Dancing Script', cursive;
      font-size: 25px;
      font-weight: 700;
      color: #8b1e3f;
    }
  </style>
</head>
<body>

  <!-- Reusable SVG definition for the same cute illustration heart -->
  <svg style="display: none;">
    <defs>
      <g id="mini-heart">
        <path d="M50 32 C42 16, 20 18, 20 38 C20 54, 40 68, 50 82 C60 68, 80 54, 80 38 C80 18, 58 16, 50 32 Z" fill="none" stroke="#ba6878" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </defs>
  </svg>

  <!-- Organic & minimal hearts placed naturally around letter space -->
  <svg class="doodle-heart h1" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h2" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h3" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h4" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h5" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>
  <svg class="doodle-heart h6" viewBox="0 0 100 100"><use href="#mini-heart"/></svg>

  <div class="main-wrapper">
    <a href="page2.html" class="back-btn">← Back to Letters</a>

    <div class="letter-body">
      <div class="letter-header">_Our First Memory_</div>
      <div class="divider"></div>
      
      <div class="letter-content">
        _Sample text: Every single moment with you feels like a beautiful dream that I never want to wake up from. Looking at you, holding your hands, and just sharing simple moments together means everything to me..._
      </div>

      <div class="signature">
        _Forever Yours ❤️_
      </div>
    </div>
  </div>

</body>
</html>
