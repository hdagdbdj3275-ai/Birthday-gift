      padding: 0;
      user-select: none;

      background-repeat: repeat;
      background-size: 90px 90px, 140px 140px;
      background-position: 0 0, 45px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 12px;
      border-left: 12px solid #8b1e3f;
      border-right: 12px solid #8b1e3f;
      font-family: 'Playfair Display', Georgia, serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
      max-width: 360px;
      margin: auto 0;
    }

    /* Aesthetic Polaroid Card */
    .polaroid-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .polaroid {
      background: #ffffff;
      padding: 10px 10px 18px 10px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(139, 30, 63, 0.12);
      border: 1px solid #ebd3da;
      text-align: center;
      transform: rotate(-1.5deg);
      transition: transform 0.3s ease;
    }

    .polaroid img {
      width: 170px;
      height: 170px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .polaroid .caption {
      margin-top: 10px;
      font-family: 'Dancing Script', cursive;
      font-size: 20px;
      font-weight: 700;
      color: #6a1b29;
    }

    /* Keypad Section */
    .keypad-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      padding: 18px 16px 20px 16px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(139, 30, 63, 0.12);
      border: 1.5px solid #f2cfd8;
      width: 100%;
      max-width: 310px;
    }

    .title-pill {
      background: #faf4ee;
      padding: 5px 14px;
      border-radius: 16px;
      border: 1px solid #ebd7d0;
      margin-bottom: 14px;
      text-align: center;
    }

    .title {
      font-family: 'Dancing Script', cursive;
      color: #6a1b29;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.2;
    }

    .passcode-display {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
