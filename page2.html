<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Moments</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: #faf4ee; /* Clean Single Warm Cream Background */
      font-family: 'Georgia', 'Playfair Display', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 12px;
      /* Cute aesthetic side borders */
      border-left: 14px solid #8b1e3f;
      border-right: 14px solid #8b1e3f;
    }

    .main-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .corner-decor-tl {
      position: fixed;
      top: 14px;
      left: 20px;
      font-size: 22px;
    }

    .corner-decor-tr {
      position: fixed;
      top: 14px;
      right: 20px;
      font-size: 22px;
    }

    /* Heading exactly as requested */
    .main-title {
      font-size: 22px;
      font-weight: 700;
      color: #3e2723;
      margin-bottom: 22px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .envelope-group {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      align-items: center;
    }

    .envelope-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      width: 100%;
      max-width: 320px;
      transition: transform 0.2s ease;
    }

    .envelope-item:hover {
      transform: translateY(-3px) scale(1.02);
    }

    .envelope-item:active {
      transform: scale(0.97);
    }

    .tap-text {
      font-size: 18px;
      color: #3e2723;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .envelope-container {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .envelope-img {
      width: 240px;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.12));
    }

    .badge-pill {
      margin-top: -14px;
      background: #ffffff;
      border: 1.5px solid #d7ccc8;
      border-radius: 20px;
      padding: 5px 22px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #5d4037;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="corner-decor-tl">🎀</div>
  <div class="corner-decor-tr">🍒</div>

  <div class="main-wrapper">
    <!-- Exactly as requested in underscores -->
    <h1 class="main-title">_My some special moment 🫣_</h1>

    <div class="envelope-group">
      
      <!-- Envelope 1 -->
      <a href="envelope1.html" class="envelope-item">
        <div class="tap-text">Tap to open</div>
        <div class="envelope-container">
          <img class="envelope-img" src="envelope.png" alt="Envelope 1">
          <div class="badge-pill">LETTER 01</div>
        </div>
      </a>

      <!-- Envelope 2 -->
      <a href="envelope2.html" class="envelope-item">
        <div class="tap-text">Tap to open</div>
        <div class="envelope-container">
          <img class="envelope-img" src="envelope.png" alt="Envelope 2">
          <div class="badge-pill">LETTER 02</div>
        </div>
      </a>

      <!-- Envelope 3 -->
      <a href="envelope3.html" class="envelope-item">
        <div class="tap-text">Tap to open</div>
        <div class="envelope-container">
          <img class="envelope-img" src="envelope.png" alt="Envelope 3">
          <div class="badge-pill">LETTER 03</div>
        </div>
      </a>

    </div>
  </div>

</body>
</html>
