<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letters For You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: #fce7ec; /* Soft Light Pink Aesthetic */
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 14px;
    }

    /* Outer Card Box */
    .card-container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 28px 20px 32px 20px;
      box-shadow: 0 12px 35px rgba(225, 112, 133, 0.22);
      border: 3px solid #ffccd5;
      position: relative;
      text-align: center;
    }

    /* Cute Corner Accents */
    .corner-decor-tl {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: 20px;
      opacity: 0.8;
    }
    .corner-decor-tr {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 20px;
      opacity: 0.8;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: #8b1e3f;
      letter-spacing: 0.5px;
      margin-bottom: 22px;
      margin-top: 5px;
      font-style: italic;
    }

    /* Envelopes Column */
    .envelopes-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      width: 100%;
    }

    /* Realistic Vintage Envelope Card */
    .envelope-box {
      width: 100%;
      max-width: 380px;
      height: 140px;
      background: #f7eedf; /* Vintage cream paper tone */
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      text-decoration: none;
      overflow: hidden;
      border: 1px solid #ebd8be;
    }

    .envelope-box:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 24px rgba(219, 75, 110, 0.2);
    }

    .envelope-box:active {
      transform: scale(0.98);
    }

    /* Envelope Top Flap Simulation */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: #f2e4d0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-bottom: 1px solid #e2cbaf;
      z-index: 1;
    }

    /* Wax Heart Seal */
    .wax-seal {
      position: absolute;
      top: 52px;
      width: 38px;
      height: 38px;
      background: radial-gradient(circle, #f472b6 0%, #db2777 85%, #9d174d 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff4cb;
      font-size: 16px;
      box-shadow: 0 4px 8px rgba(157, 23, 77, 0.35);
      z-index: 2;
    }

    .envelope-text {
      position: absolute;
      bottom: 16px;
      font-size: 15px;
      font-weight: 600;
      color: #7c4a35;
      letter-spacing: 0.8px;
      z-index: 2;
    }

    .tag-number {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: 11px;
      font-weight: bold;
      color: #a07a62;
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 2;
    }

    /* Bottom Subtext */
    .footer-note {
      margin-top: 24px;
      font-size: 13px;
      color: #a8727d;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="corner-decor-tl">🎀</div>
    <div class="corner-decor-tr">🍒</div>

    <div class="header-title">Three letters for you</div>

    <div class="envelopes-wrapper">

      <!-- Envelope 1 -->
      <a class="envelope-box" href="envelope1.html">
        <div class="tag-number">Letter 01</div>
        <div class="envelope-flap"></div>
        <div class="wax-seal">🌙</div>
        <div class="envelope-text">Tap to open</div>
      </a>

      <!-- Envelope 2 -->
      <a class="envelope-box" href="envelope2.html">
        <div class="tag-number">Letter 02</div>
        <div class="envelope-flap"></div>
        <div class="wax-seal">💖</div>
        <div class="envelope-text">Tap to open</div>
      </a>

      <!-- Envelope 3 -->
      <a class="envelope-box" href="envelope3.html">
        <div class="tag-number">Letter 03</div>
        <div class="envelope-flap"></div>
        <div class="wax-seal">✨</div>
        <div class="envelope-text">Tap to open</div>
      </a>

    </div>

    <div class="footer-note">Choose one to read ✨</div>
  </div>

</body>
</html>
