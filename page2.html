<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three Letters</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: #fde8ed; /* Aesthetic Coquette Light Pink */
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
    }

    /* Outer White Card Container */
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 30px 18px 36px 18px;
      box-shadow: 0 10px 30px rgba(225, 112, 133, 0.2);
      border: 3px solid #ffccd5;
      text-align: center;
      position: relative;
    }

    .corner-bow-left {
      position: absolute;
      top: 12px;
      left: 14px;
      font-size: 22px;
    }

    .corner-bow-right {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 22px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: #8b1e3f;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
      font-style: italic;
    }

    /* Vertical Column of 3 Envelopes */
    .envelope-list {
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: center;
      width: 100%;
    }

    .envelope-link {
      display: block;
      width: 100%;
      max-width: 340px;
      text-decoration: none;
      transition: transform 0.25s ease, filter 0.25s ease;
      cursor: pointer;
    }

    .envelope-link:hover {
      transform: translateY(-4px) scale(1.02);
      filter: drop-shadow(0 8px 16px rgba(219, 75, 110, 0.25));
    }

    .envelope-link:active {
      transform: scale(0.97);
    }

    /* Envelope Image Card */
    .envelope-card {
      position: relative;
      width: 100%;
      height: 160px;
      border-radius: 14px;
      overflow: hidden;
      background: #f7eedf;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Background image if uploaded as envelope.png */
    .envelope-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Text Overlay on Envelope */
    .tap-text {
      position: absolute;
      top: 28px;
      font-size: 14px;
      color: #634839;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .envelope-number {
      position: absolute;
      bottom: 14px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      color: #8c5b46;
      background: rgba(255, 255, 255, 0.85);
      padding: 3px 12px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="corner-bow-left">🎀</div>
    <div class="corner-bow-right">🍒</div>

    <div class="title">Open when you're ready</div>

    <div class="envelope-list">
      
      <!-- Envelope 1 -->
      <a href="envelope1.html" class="envelope-link">
        <div class="envelope-card">
          <!-- Agar aapne GitHub par envelope.png upload ki hai toh wahi yahan load hogi -->
          <img class="envelope-img" src="envelope.png" onerror="this.src='https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=600'" alt="Envelope 1">
          <div class="tap-text">Tap to open</div>
          <div class="envelope-number">Letter 01</div>
        </div>
      </a>

      <!-- Envelope 2 -->
      <a href="envelope2.html" class="envelope-link">
        <div class="envelope-card">
          <img class="envelope-img" src="envelope.png" onerror="this.src='https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=600'" alt="Envelope 2">
          <div class="tap-text">Tap to open</div>
          <div class="envelope-number">Letter 02</div>
        </div>
      </a>

      <!-- Envelope 3 -->
      <a href="envelope3.html" class="envelope-link">
        <div class="envelope-card">
          <img class="envelope-img" src="envelope.png" onerror="this.src='https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=600'" alt="Envelope 3">
          <div class="tap-text">Tap to open</div>
          <div class="envelope-number">Letter 03</div>
        </div>
      </a>

    </div>
  </div>

</body>
</html>
