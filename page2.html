<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Moments</title>
  <!-- Aesthetic Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,500;1,600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: #faf4ee;
      font-family: 'Playfair Display', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 14px 40px 14px;
      border-left: 14px solid #8b1e3f;
      border-right: 14px solid #8b1e3f;
      position: relative;
    }

    /* Fixed Aesthetic Corners */
    .corner-decor-tl {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 24px;
      line-height: 1;
      z-index: 5;
    }

    .corner-decor-tr {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 24px;
      line-height: 1;
      z-index: 5;
    }

    .main-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 25px; /* Spacing so it doesn't overlap with bow & cherries */
    }

    /* Exact Text & Aesthetic Font */
    .main-title {
      font-family: 'Dancing Script', cursive;
      font-size: 32px;
      font-weight: 700;
      color: #5a192d;
      margin-bottom: 28px;
      text-align: center;
      padding: 0 10px;
      line-height: 1.3;
      text-shadow: 0 1px 2px rgba(139, 30, 63, 0.1);
    }

    .envelope-group {
      display: flex;
      flex-direction: column;
      gap: 32px;
      width: 100%;
      align-items: center;
    }

    .envelope-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      width: 100%;
      max-width: 320px;
      transition: transform 0.25s ease;
    }

    .envelope-item:hover {
      transform: translateY(-4px) scale(1.02);
    }

    .envelope-item:active {
      transform: scale(0.97);
    }

    .tap-text {
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      color: #3e2723;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      font-style: italic;
    }

    .envelope-container {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .envelope-img {
      width: 250px;
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.1));
    }

    .badge-pill {
      margin-top: -14px;
      background: #ffffff;
      border: 1.5px solid #e2cbaf;
      border-radius: 20px;
      padding: 5px 24px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #6d4c41;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- Decorative elements positioned clearly in corners -->
  <div class="corner-decor-tl">🎀</div>
  <div class="corner-decor-tr">🍒</div>

  <div class="main-wrapper">
    <!-- Exactly as requested in underscores -->
    <h1 class="main-title">_My some special moment 🫣_</h1>

    <div class="envelope-group">
      
      <!-- Envelope 1 -->
      <a href="envelope1.html" class="envelope-item">
        <div class="tap-text">Tap to open</div>
        <div class="envelope-container">
          <img class="envelope-img" src="envelope.png" alt="Envelope 1">
          <div class="badge-pill">LETTER 01</div>
        </div>
      </a>

      <!-- Envelope 2 -->
      <a href="envelope2.html" class="envelope-item">
        <div class="tap-text">Tap to open</div>
        <div class="envelope-container">
          <img class="envelope-img" src="envelope.png" alt="Envelope 2">
          <div class="badge-pill">LETTER 02</div>
        </div>
      </a>

      <!-- Envelope 3 -->
      <a href="envelope3.html" class="envelope-item">
        <div class="tap-text">Tap to open</div>
        <div class="envelope-container">
          <img class="envelope-img" src="envelope.png" alt="Envelope 3">
          <div class="badge-pill">LETTER 03</div>
        </div>
      </a>

    </div>
  </div>

</body>
</html>
